name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22] # engines: >=18; 22 is LTS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Smoke --version
        run: node src/cli.js --version
      - name: Tests
        run: npm test
      - name: Packaging dry-run
        run: npm pack --dry-run