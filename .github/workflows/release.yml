name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # npm provenance

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Tag matches package.json
        run: |
          PKG=$(node -p "require('./package.json').version")
          case "$GITHUB_REF" in
            refs/tags/*)
              VERSION=${GITHUB_REF#refs/tags/v}
              test "$VERSION" = "$PKG" || { echo "tag v$VERSION != package $PKG"; exit 1; }
              echo "Tag v$VERSION matches package version $PKG"
              ;;
            *)
              echo "Not a tag ref ($GITHUB_REF) — skipping the tag/version check"
              ;;
          esac
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Pack
        run: npm pack --pack-destination .
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: jesus-cli-*.tgz

  publish-npm:
    if: vars.PUBLISH_TO_NPM == 'true'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish
        # Only "this version already exists" is tolerated. Every other failure —
        # an expired or missing token, a 4xx from the registry, a provenance
        # failure — must fail the job loudly rather than look like a success.
        run: |
          set -uo pipefail
          if output=$(npm publish --provenance 2>&1); then
            echo "$output"
          elif echo "$output" | grep -q "EPUBLISHCONFLICT"; then
            echo "::notice::Version already published, skipping"
          else
            echo "$output"
            echo "::error::npm publish failed for a reason other than an existing version"
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
